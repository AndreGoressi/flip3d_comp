name: Build flip3d_comp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Locate EXE and create ZIP
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter *.exe |
                 Where-Object { $_.Name -eq "flip3d.exe" } |
                 Select-Object -First 1

          if (-not $exe)
          {
              throw "flip3d.exe not found!"
          }

          Compress-Archive `
              -Path $exe.FullName `
              -DestinationPath build\flip3d.zip `
              -Force

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: flip3d
          path: build/flip3d.zip
